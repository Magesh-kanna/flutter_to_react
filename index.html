<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 
      FLUTTER EQUIVALENT:
      In Flutter Web, you have `web/index.html`.
      This HTML file is the single HTML shell where the entire React Single Page App (SPA) mounts.
    -->
    <title>Flutter to React | Interactive Mastery Guide</title>
    <meta name="description" content="A comprehensive, interactive ReactJS learning playground built specifically for Flutter engineers." />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body>
    <!-- 
      FLUTTER EQUIVALENT:
      In Flutter, the engine attaches the FlutterView to the window or web canvas.
      In React, this single `<div id="root"></div>` is where your entire Widget Tree (Component Tree) is rendered!
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
